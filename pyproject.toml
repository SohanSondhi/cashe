[project]
name = "cashe"
version = "0.1.0"
description = "Financial evidence layer — investigate cash variance from bank statements outward."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.60.0",
    "tavily-python>=0.5.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "websockets>=14.0",
    "twilio>=9.0.0",
    "playwright>=1.51,<2",
    "langchain-core>=1,<2",
    "prismtrace-sdk==0.4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
cashe = "cashe.main:run"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cashe*"]

[tool.setuptools.package-data]
cashe = ["templates/*", "static/*", "fixtures/tavily_cache/*", "browser/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
